[project]
name = "jarvis-voice"
version = "0.1.0"
description = "Spoken briefs for Claude Code: hear the outcome, read the detail."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "filelock>=4.2.8",
    "kokoro-onnx>=0.4",
    "numpy>=2.5.4",
    "soundfile>=0.12",
]

[project.scripts]
jarvis = "jarvis_voice.cli:main"
jarvis-hook = "jarvis_voice.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_voice"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
